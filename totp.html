<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOTP Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(440px, calc(100vw - 32px));
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #9ca3af;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      background: #f9fafb;
      color: #111827;
    }

    button:hover {
      background: #e5e7eb;
    }

    .result {
      margin-top: 28px;
      text-align: center;
    }

    .code {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 8px;
      font-variant-numeric: tabular-nums;
    }

    .timer {
      margin-top: 10px;
      font-size: 18px;
      color: #d1d5db;
    }

    .progress {
      margin-top: 14px;
      width: 100%;
      height: 8px;
      background: #374151;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: #f9fafb;
      transition: width 0.2s linear;
    }

    .error {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      color: #fca5a5;
      font-size: 14px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>TOTP Generator</h1>

    <label for="secret">TOTP secret</label>

    <input
      id="secret"
      type="password"
      autocomplete="off"
      spellcheck="false"
      placeholder="JBSWY3DPEHPK3PXP"
    >

    <button id="generate">Generate</button>

    <div id="error" class="error"></div>

    <section id="result" class="result" hidden>
      <div id="code" class="code">------</div>

      <div id="timer" class="timer">
        Valid for 30 seconds
      </div>

      <div class="progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </section>

    <div class="hint">
      The secret is processed locally in your browser and is never sent anywhere.
    </div>
  </main>

  <script>
    const PERIOD = 30;
    const DIGITS = 6;

    let currentSecret = null;
    let lastCounter = null;

    const secretInput = document.getElementById("secret");
    const generateButton = document.getElementById("generate");
    const resultElement = document.getElementById("result");
    const codeElement = document.getElementById("code");
    const timerElement = document.getElementById("timer");
    const progressBarElement = document.getElementById("progress-bar");
    const errorElement = document.getElementById("error");

    function decodeBase32(value) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

      const normalized = value
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/-/g, "")
        .replace(/=+$/g, "");

      if (!normalized) {
        throw new Error("Secret is empty.");
      }

      let bits = "";

      for (const character of normalized) {
        const index = alphabet.indexOf(character);

        if (index === -1) {
          throw new Error(`Invalid Base32 character: ${character}`);
        }

        bits += index.toString(2).padStart(5, "0");
      }

      const bytes = [];

      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.slice(i, i + 8), 2));
      }

      return new Uint8Array(bytes);
    }

    function counterToBytes(counter) {
      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);

      const high = Math.floor(counter / 0x100000000);
      const low = counter >>> 0;

      view.setUint32(0, high);
      view.setUint32(4, low);

      return buffer;
    }

    async function generateTotp(secret, timestamp = Date.now()) {
      const secretBytes = decodeBase32(secret);

      const key = await crypto.subtle.importKey(
        "raw",
        secretBytes,
        {
          name: "HMAC",
          hash: "SHA-1"
        },
        false,
        ["sign"]
      );

      const counter = Math.floor(timestamp / 1000 / PERIOD);
      const counterBytes = counterToBytes(counter);

      const signature = new Uint8Array(
        await crypto.subtle.sign(
          "HMAC",
          key,
          counterBytes
        )
      );

      const offset = signature[signature.length - 1] & 0x0f;

      const binary =
        ((signature[offset] & 0x7f) << 24) |
        ((signature[offset + 1] & 0xff) << 16) |
        ((signature[offset + 2] & 0xff) << 8) |
        (signature[offset + 3] & 0xff);

      const otp = binary % (10 ** DIGITS);

      return otp.toString().padStart(DIGITS, "0");
    }

    async function update() {
      if (!currentSecret) {
        return;
      }

      const now = Date.now();
      const seconds = Math.floor(now / 1000);

      const counter = Math.floor(seconds / PERIOD);
      const elapsed = seconds % PERIOD;
      const remaining = PERIOD - elapsed;

      timerElement.textContent =
        `Valid for ${remaining} second${remaining === 1 ? "" : "s"}`;

      const progress = (remaining / PERIOD) * 100;
      progressBarElement.style.width = `${progress}%`;

      if (counter === lastCounter) {
        return;
      }

      lastCounter = counter;

      try {
        const code = await generateTotp(currentSecret, now);

        codeElement.textContent =
          `${code.slice(0, 3)} ${code.slice(3)}`;

        errorElement.textContent = "";
      } catch (error) {
        errorElement.textContent = error.message;
      }
    }

    async function start() {
      try {
        const secret = secretInput.value.trim();

        decodeBase32(secret);

        currentSecret = secret;
        lastCounter = null;

        resultElement.hidden = false;
        errorElement.textContent = "";

        await update();
      } catch (error) {
        currentSecret = null;
        resultElement.hidden = true;
        errorElement.textContent = error.message;
      }
    }

    generateButton.addEventListener("click", start);

    secretInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        start();
      }
    });

    setInterval(update, 250);
  </script>
</body>
</html>
