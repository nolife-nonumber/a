<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <!-- Comment -->

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'self' 'nonce-qr-local';
      style-src 'unsafe-inline';
      connect-src 'none';
      img-src 'self';
      font-src 'none';
      object-src 'none';
      frame-src 'none';
      worker-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <title>QR Code Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 32px));
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #9ca3af;
    }

    .counter {
      margin-top: 7px;
      text-align: right;
      font-size: 12px;
      color: #9ca3af;
    }

    .counter.warning {
      color: #fbbf24;
    }

    .counter.error {
      color: #fca5a5;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #generate {
      margin-top: 14px;
      background: #f9fafb;
      color: #111827;
    }

    #generate:hover:not(:disabled) {
      background: #e5e7eb;
    }

    .secondary {
      margin-top: 12px;
      background: #374151;
      color: #f9fafb;
    }

    .secondary:hover {
      background: #4b5563;
    }

    .error {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      color: #fca5a5;
      font-size: 14px;
    }

    .result {
      margin-top: 22px;
      text-align: center;
    }

    .qr-container {
      display: inline-flex;
      max-width: 100%;
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .info {
      margin-top: 12px;
      color: #d1d5db;
      font-size: 13px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #9ca3af;
      text-align: center;
    }

    .privacy {
      margin-top: 8px;
      color: #6ee7b7;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>QR Code Generator</h1>

    <label for="text">Text to encode</label>

    <textarea
      id="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="Enter text, URL, JSON, configuration, etc."
    ></textarea>

    <div id="counter" class="counter">
      0 / 2953 bytes
    </div>

    <button id="generate" disabled>
      Generate QR Code
    </button>

    <div id="error" class="error"></div>

    <section id="result" class="result" hidden>
      <div class="qr-container">
        <canvas id="qr"></canvas>
      </div>

      <div id="info" class="info"></div>

      <button id="download" class="secondary">
        Download PNG
      </button>
    </section>

    <div class="hint">
      Press Ctrl+Enter to generate.

      <div class="privacy">
        Everything is processed locally in your browser.
        Network access is disabled.
      </div>
    </div>
  </main>

  <script src="js/qrcode.min.js"></script>

  <script nonce="qr-local">
    "use strict";

    const ERROR_CORRECTION_LEVEL = "L";
    const MAX_BYTES = 2953;

    const QUIET_ZONE = 4;
    const MODULE_SIZE = 4;

    const encoder = new TextEncoder();

    const textInput =
      document.getElementById("text");

    const generateButton =
      document.getElementById("generate");

    const downloadButton =
      document.getElementById("download");

    const resultElement =
      document.getElementById("result");

    const canvas =
      document.getElementById("qr");

    const errorElement =
      document.getElementById("error");

    const counterElement =
      document.getElementById("counter");

    const infoElement =
      document.getElementById("info");


    /*
     * qrcode-generator's default encoding is not proper UTF-8.
     * Use the browser's UTF-8 encoder instead.
     */
    qrcode.stringToBytes = value => {
      return Array.from(
        encoder.encode(value)
      );
    };


    function getByteLength(value) {
      return encoder.encode(value).length;
    }


    function updateCounter() {
      const bytes =
        getByteLength(textInput.value);

      counterElement.textContent =
        `${bytes} / ${MAX_BYTES} bytes`;

      counterElement.classList.remove(
        "warning",
        "error"
      );

      if (bytes > MAX_BYTES) {
        counterElement.classList.add("error");
      } else if (bytes > MAX_BYTES * 0.85) {
        counterElement.classList.add("warning");
      }

      generateButton.disabled =
        bytes === 0 ||
        bytes > MAX_BYTES;
    }


    function drawQr(qr) {
      const moduleCount =
        qr.getModuleCount();

      const totalModules =
        moduleCount +
        QUIET_ZONE * 2;

      const size =
        totalModules *
        MODULE_SIZE;

      canvas.width = size;
      canvas.height = size;

      const context =
        canvas.getContext("2d");

      context.imageSmoothingEnabled = false;

      context.fillStyle = "#ffffff";

      context.fillRect(
        0,
        0,
        size,
        size
      );

      context.fillStyle = "#000000";

      for (
        let row = 0;
        row < moduleCount;
        row++
      ) {
        for (
          let column = 0;
          column < moduleCount;
          column++
        ) {
          if (!qr.isDark(row, column)) {
            continue;
          }

          const x =
            (column + QUIET_ZONE) *
            MODULE_SIZE;

          const y =
            (row + QUIET_ZONE) *
            MODULE_SIZE;

          context.fillRect(
            x,
            y,
            MODULE_SIZE,
            MODULE_SIZE
          );
        }
      }
    }


    function generate() {
      const text =
        textInput.value;

      const byteLength =
        getByteLength(text);

      errorElement.textContent = "";
      resultElement.hidden = true;

      if (!text) {
        errorElement.textContent =
          "Text is empty.";

        return;
      }

      if (byteLength > MAX_BYTES) {
        errorElement.textContent =
          `Data is too large: ${byteLength} bytes. ` +
          `Maximum is ${MAX_BYTES} bytes.`;

        return;
      }

      try {
        /*
         * 0:
         * automatically choose the smallest QR Version
         * from 1 through 40.
         *
         * L:
         * lowest error correction level and therefore
         * maximum data capacity.
         */
        const qr = qrcode(
          0,
          ERROR_CORRECTION_LEVEL
        );

        qr.addData(
          text,
          "Byte"
        );

        qr.make();

        drawQr(qr);

        const moduleCount =
          qr.getModuleCount();

        const version =
          (moduleCount - 17) / 4;

        infoElement.textContent =
          `Version ${version} · ` +
          `${moduleCount}×${moduleCount} modules · ` +
          `${byteLength} bytes · ` +
          `ECC ${ERROR_CORRECTION_LEVEL}`;

        resultElement.hidden = false;
      } catch (error) {
        errorElement.textContent =
          error instanceof Error
            ? error.message
            : String(error);
      }
    }


    function downloadPng() {
      canvas.toBlob(blob => {
        if (!blob) {
          errorElement.textContent =
            "Unable to create PNG.";

          return;
        }

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download = "qr-code.png";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(
          () => URL.revokeObjectURL(url),
          1000
        );
      }, "image/png");
    }


    generateButton.addEventListener(
      "click",
      generate
    );


    downloadButton.addEventListener(
      "click",
      downloadPng
    );


    textInput.addEventListener(
      "input",
      updateCounter
    );


    textInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          (
            event.ctrlKey ||
            event.metaKey
          )
        ) {
          event.preventDefault();
          generate();
        }
      }
    );


    updateCounter();
  </script>
</body>
</html>
