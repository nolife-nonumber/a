<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      script-src 'unsafe-inline';
      style-src 'unsafe-inline';
      img-src data: blob:;
      connect-src 'none';
      font-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
    "
  >

  <title>QR Code Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 32px));
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #9ca3af;
    }

    .counter {
      margin-top: 7px;
      text-align: right;
      color: #9ca3af;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    #generate {
      margin-top: 14px;
      background: #f9fafb;
      color: #111827;
    }

    #generate:hover {
      background: #e5e7eb;
    }

    .secondary {
      margin-top: 10px;
      background: #374151;
      color: #f9fafb;
    }

    .secondary:hover:not(:disabled) {
      background: #4b5563;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .error {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      color: #fca5a5;
      font-size: 14px;
    }

    .result {
      margin-top: 22px;
      text-align: center;
    }

    .qr-container {
      display: inline-flex;
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
    }

    canvas {
      display: block;
      width: min(360px, calc(100vw - 100px));
      height: auto;
      image-rendering: pixelated;
    }

    .info {
      margin-top: 12px;
      color: #d1d5db;
      font-size: 13px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #9ca3af;
      text-align: center;
    }

    .privacy {
      margin-top: 8px;
      color: #6ee7b7;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>QR Code Generator</h1>

    <label for="text">Text to encode</label>

    <textarea
      id="text"
      spellcheck="false"
      placeholder="Enter text, URL, JSON, Wi-Fi configuration, etc."
    ></textarea>

    <div id="counter" class="counter">
      0 bytes
    </div>

    <button id="generate">
      Generate QR Code
    </button>

    <div id="error" class="error"></div>

    <section id="result" class="result" hidden>
      <div class="qr-container">
        <canvas id="qr"></canvas>
      </div>

      <div id="info" class="info"></div>

      <button id="download" class="secondary" disabled>
        Download PNG
      </button>
    </section>

    <div class="hint">
      Everything is processed locally in your browser.
      <div class="privacy">
        Network access is disabled by Content Security Policy.
      </div>
    </div>
  </main>

  <script>
    /*
     * Minimal self-contained QR Code Model 2 encoder.
     *
     * Features:
     * - Byte mode
     * - UTF-8
     * - Error correction level L
     * - QR versions 1-20
     * - Automatic version selection
     * - Automatic mask selection
     * - Reed-Solomon error correction
     *
     * No external libraries or network requests.
     */

    const QUIET_ZONE = 4;
    const SCALE = 8;

    const textInput = document.getElementById("text");
    const generateButton = document.getElementById("generate");
    const downloadButton = document.getElementById("download");
    const resultElement = document.getElementById("result");
    const canvas = document.getElementById("qr");
    const errorElement = document.getElementById("error");
    const counterElement = document.getElementById("counter");
    const infoElement = document.getElementById("info");

    /*
     * Reed-Solomon block layout for Error Correction Level L.
     *
     * Each tuple:
     *
     *   [number of blocks, total codewords per block, data codewords per block]
     */
    const RS_BLOCKS_L = {
      1:  [[1, 26, 19]],
      2:  [[1, 44, 34]],
      3:  [[1, 70, 55]],
      4:  [[1, 100, 80]],
      5:  [[1, 134, 108]],
      6:  [[2, 86, 68]],
      7:  [[2, 98, 78]],
      8:  [[2, 121, 97]],
      9:  [[2, 146, 116]],
      10: [[2, 86, 68], [2, 87, 69]],
      11: [[4, 101, 81]],
      12: [[2, 116, 92], [2, 117, 93]],
      13: [[4, 133, 107]],
      14: [[3, 145, 115], [1, 146, 116]],
      15: [[5, 109, 87], [1, 110, 88]],
      16: [[5, 122, 98], [1, 123, 99]],
      17: [[1, 135, 107], [5, 136, 108]],
      18: [[5, 150, 120], [1, 151, 121]],
      19: [[3, 141, 113], [4, 142, 114]],
      20: [[3, 135, 107], [5, 136, 108]]
    };

    /*
     * Galois field GF(256)
     */

    const GF_EXP = new Uint8Array(512);
    const GF_LOG = new Uint8Array(256);

    function initializeGaloisField() {
      let value = 1;

      for (let i = 0; i < 255; i++) {
        GF_EXP[i] = value;
        GF_LOG[value] = i;

        value <<= 1;

        if (value & 0x100) {
          value ^= 0x11d;
        }
      }

      for (let i = 255; i < 512; i++) {
        GF_EXP[i] = GF_EXP[i - 255];
      }
    }

    initializeGaloisField();

    function gfMultiply(a, b) {
      if (a === 0 || b === 0) {
        return 0;
      }

      return GF_EXP[GF_LOG[a] + GF_LOG[b]];
    }

    function makeGeneratorPolynomial(degree) {
      let polynomial = [1];

      for (let i = 0; i < degree; i++) {
        const next = new Array(polynomial.length + 1).fill(0);

        for (let j = 0; j < polynomial.length; j++) {
          next[j] ^= polynomial[j];
          next[j + 1] ^= gfMultiply(
            polynomial[j],
            GF_EXP[i]
          );
        }

        polynomial = next;
      }

      return polynomial;
    }

    function reedSolomon(data, degree) {
      const generator = makeGeneratorPolynomial(degree);
      const result = new Uint8Array(degree);

      for (const byte of data) {
        const factor = byte ^ result[0];

        for (let i = 0; i < degree - 1; i++) {
          result[i] = result[i + 1];
        }

        result[degree - 1] = 0;

        for (let i = 0; i < degree; i++) {
          result[i] ^=
            gfMultiply(generator[i + 1], factor);
        }
      }

      return Array.from(result);
    }

    /*
     * Bit helpers
     */

    function appendBits(bits, value, length) {
      for (let i = length - 1; i >= 0; i--) {
        bits.push((value >>> i) & 1);
      }
    }

    function bitsToBytes(bits) {
      const result = [];

      for (let i = 0; i < bits.length; i += 8) {
        let value = 0;

        for (let j = 0; j < 8; j++) {
          value =
            (value << 1) |
            (bits[i + j] || 0);
        }

        result.push(value);
      }

      return result;
    }

    function getDataCodewordCount(version) {
      return RS_BLOCKS_L[version].reduce(
        (sum, [count, , data]) =>
          sum + count * data,
        0
      );
    }

    function getCharacterCountBits(version) {
      return version <= 9 ? 8 : 16;
    }

    function chooseVersion(dataLength) {
      for (let version = 1; version <= 20; version++) {
        const capacity =
          getDataCodewordCount(version) * 8;

        const required =
          4 +
          getCharacterCountBits(version) +
          dataLength * 8;

        if (required <= capacity) {
          return version;
        }
      }

      throw new Error(
        "Data is too large. Maximum size is approximately 858 UTF-8 bytes."
      );
    }

    function createDataCodewords(bytes, version) {
      const capacity =
        getDataCodewordCount(version) * 8;

      const bits = [];

      // Byte mode: 0100
      appendBits(bits, 0b0100, 4);

      appendBits(
        bits,
        bytes.length,
        getCharacterCountBits(version)
      );

      for (const byte of bytes) {
        appendBits(bits, byte, 8);
      }

      const terminatorLength =
        Math.min(4, capacity - bits.length);

      appendBits(bits, 0, terminatorLength);

      while (bits.length % 8 !== 0) {
        bits.push(0);
      }

      const data = bitsToBytes(bits);

      const targetLength =
        getDataCodewordCount(version);

      let toggle = false;

      while (data.length < targetLength) {
        data.push(toggle ? 0x11 : 0xec);
        toggle = !toggle;
      }

      return data;
    }

    function createFinalCodewords(data, version) {
      const specs = RS_BLOCKS_L[version];

      const dataBlocks = [];
      const errorBlocks = [];

      let offset = 0;

      for (const [count, totalCount, dataCount] of specs) {
        for (let i = 0; i < count; i++) {
          const block =
            data.slice(offset, offset + dataCount);

          offset += dataCount;

          const errorCount =
            totalCount - dataCount;

          dataBlocks.push(block);
          errorBlocks.push(
            reedSolomon(block, errorCount)
          );
        }
      }

      const result = [];

      const maxDataLength =
        Math.max(...dataBlocks.map(block => block.length));

      for (let i = 0; i < maxDataLength; i++) {
        for (const block of dataBlocks) {
          if (i < block.length) {
            result.push(block[i]);
          }
        }
      }

      const maxErrorLength =
        Math.max(...errorBlocks.map(block => block.length));

      for (let i = 0; i < maxErrorLength; i++) {
        for (const block of errorBlocks) {
          if (i < block.length) {
            result.push(block[i]);
          }
        }
      }

      return result;
    }

    /*
     * BCH encoding
     */

    function bitLength(value) {
      let length = 0;

      while (value !== 0) {
        length++;
        value >>>= 1;
      }

      return length;
    }

    function calculateBch(value, polynomial) {
      let current = value;

      const polynomialLength =
        bitLength(polynomial);

      while (
        bitLength(current) >= polynomialLength
      ) {
        current ^=
          polynomial <<
          (
            bitLength(current) -
            polynomialLength
          );
      }

      return current;
    }

    function getFormatBits(mask) {
      // Error correction level L = binary 01
      const data = (1 << 3) | mask;

      const value =
        (data << 10) |
        calculateBch(data << 10, 0x537);

      return value ^ 0x5412;
    }

    function getVersionBits(version) {
      return (
        (version << 12) |
        calculateBch(version << 12, 0x1f25)
      );
    }

    /*
     * Matrix construction
     */

    function createEmptyMatrix(size) {
      return Array.from(
        { length: size },
        () => new Array(size).fill(null)
      );
    }

    function createFunctionMatrix(size) {
      return Array.from(
        { length: size },
        () => new Array(size).fill(false)
      );
    }

    function setFunctionModule(
      matrix,
      functionMatrix,
      row,
      column,
      value
    ) {
      if (
        row < 0 ||
        column < 0 ||
        row >= matrix.length ||
        column >= matrix.length
      ) {
        return;
      }

      matrix[row][column] = value;
      functionMatrix[row][column] = true;
    }

    function addFinderPattern(
      matrix,
      functionMatrix,
      row,
      column
    ) {
      const size = matrix.length;

      for (let dy = -1; dy <= 7; dy++) {
        for (let dx = -1; dx <= 7; dx++) {
          const y = row + dy;
          const x = column + dx;

          if (
            y < 0 ||
            x < 0 ||
            y >= size ||
            x >= size
          ) {
            continue;
          }

          const dark =
            (
              dy >= 0 &&
              dy <= 6 &&
              (
                dx === 0 ||
                dx === 6
              )
            ) ||
            (
              dx >= 0 &&
              dx <= 6 &&
              (
                dy === 0 ||
                dy === 6
              )
            ) ||
            (
              dy >= 2 &&
              dy <= 4 &&
              dx >= 2 &&
              dx <= 4
            );

          setFunctionModule(
            matrix,
            functionMatrix,
            y,
            x,
            dark
          );
        }
      }
    }

    function getAlignmentPositions(version) {
      if (version === 1) {
        return [];
      }

      const size = version * 4 + 17;
      const count =
        Math.floor(version / 7) + 2;

      const step =
        version === 32
          ? 26
          : Math.ceil(
              (
                version * 4 +
                count * 2 +
                1
              ) /
              (
                count * 2 -
                2
              )
            ) * 2;

      const positions =
        new Array(count);

      positions[0] = 6;

      for (let i = count - 1, position = size - 7;
           i >= 1;
           i--, position -= step) {

        positions[i] = position;
      }

      return positions;
    }

    function addAlignmentPatterns(
      matrix,
      functionMatrix,
      version
    ) {
      const positions =
        getAlignmentPositions(version);

      for (const row of positions) {
        for (const column of positions) {
          if (functionMatrix[row][column]) {
            continue;
          }

          for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const dark =
                Math.max(
                  Math.abs(dx),
                  Math.abs(dy)
                ) !== 1;

              setFunctionModule(
                matrix,
                functionMatrix,
                row + dy,
                column + dx,
                dark
              );
            }
          }
        }
      }
    }

    function addTimingPatterns(
      matrix,
      functionMatrix
    ) {
      const size = matrix.length;

      for (let i = 8; i < size - 8; i++) {
        if (!functionMatrix[i][6]) {
          setFunctionModule(
            matrix,
            functionMatrix,
            i,
            6,
            i % 2 === 0
          );
        }

        if (!functionMatrix[6][i]) {
          setFunctionModule(
            matrix,
            functionMatrix,
            6,
            i,
            i % 2 === 0
          );
        }
      }
    }

    function setFormatInfo(
      matrix,
      functionMatrix,
      mask,
      writeBits
    ) {
      const size = matrix.length;

      const bits =
        writeBits ? getFormatBits(mask) : 0;

      for (let i = 0; i < 15; i++) {
        const value =
          writeBits
            ? ((bits >>> i) & 1) !== 0
            : false;

        let row;
        let column;

        // Vertical format information
        if (i < 6) {
          row = i;
          column = 8;
        } else if (i < 8) {
          row = i + 1;
          column = 8;
        } else {
          row = size - 15 + i;
          column = 8;
        }

        setFunctionModule(
          matrix,
          functionMatrix,
          row,
          column,
          value
        );

        // Horizontal format information
        row = 8;

        if (i < 8) {
          column = size - i - 1;
        } else if (i === 8) {
          column = 7;
        } else {
          column = 15 - i - 1;
        }

        setFunctionModule(
          matrix,
          functionMatrix,
          row,
          column,
          value
        );
      }

      // Fixed dark module
      setFunctionModule(
        matrix,
        functionMatrix,
        size - 8,
        8,
        true
      );
    }

    function setVersionInfo(
      matrix,
      functionMatrix,
      version
    ) {
      if (version < 7) {
        return;
      }

      const size = matrix.length;
      const bits = getVersionBits(version);

      for (let i = 0; i < 18; i++) {
        const value =
          ((bits >>> i) & 1) !== 0;

        const a = Math.floor(i / 3);
        const b = i % 3 + size - 11;

        setFunctionModule(
          matrix,
          functionMatrix,
          a,
          b,
          value
        );

        setFunctionModule(
          matrix,
          functionMatrix,
          b,
          a,
          value
        );
      }
    }

    /*
     * QR masks
     */

    function maskCondition(mask, row, column) {
      switch (mask) {
        case 0:
          return (row + column) % 2 === 0;

        case 1:
          return row % 2 === 0;

        case 2:
          return column % 3 === 0;

        case 3:
          return (row + column) % 3 === 0;

        case 4:
          return (
            Math.floor(row / 2) +
            Math.floor(column / 3)
          ) % 2 === 0;

        case 5:
          return (
            (row * column) % 2 +
            (row * column) % 3
          ) === 0;

        case 6:
          return (
            (
              (row * column) % 2 +
              (row * column) % 3
            ) % 2
          ) === 0;

        case 7:
          return (
            (
              (row * column) % 3 +
              (row + column) % 2
            ) % 2
          ) === 0;

        default:
          throw new Error("Invalid QR mask.");
      }
    }

    function placeData(
      matrix,
      functionMatrix,
      codewords,
      mask
    ) {
      const size = matrix.length;

      let byteIndex = 0;
      let bitIndex = 7;

      let row = size - 1;
      let direction = -1;

      for (let column = size - 1;
           column > 0;
           column -= 2) {

        if (column === 6) {
          column--;
        }

        while (true) {
          for (let offset = 0; offset < 2; offset++) {
            const x = column - offset;

            if (!functionMatrix[row][x]) {
              let dark = false;

              if (byteIndex < codewords.length) {
                dark =
                  (
                    (
                      codewords[byteIndex] >>>
                      bitIndex
                    ) &
                    1
                  ) !== 0;
              }

              if (
                maskCondition(
                  mask,
                  row,
                  x
                )
              ) {
                dark = !dark;
              }

              matrix[row][x] = dark;

              bitIndex--;

              if (bitIndex < 0) {
                byteIndex++;
                bitIndex = 7;
              }
            }
          }

          row += direction;

          if (
            row < 0 ||
            row >= size
          ) {
            row -= direction;
            direction = -direction;
            break;
          }
        }
      }
    }

    function cloneMatrix(matrix) {
      return matrix.map(row => row.slice());
    }

    /*
     * Mask scoring
     */

    function penaltyScore(matrix) {
      const size = matrix.length;
      let penalty = 0;

      // Rule 1: long runs
      for (let row = 0; row < size; row++) {
        let previous = matrix[row][0];
        let run = 1;

        for (let column = 1;
             column < size;
             column++) {

          const current =
            matrix[row][column];

          if (current === previous) {
            run++;
          } else {
            if (run >= 5) {
              penalty += 3 + (run - 5);
            }

            previous = current;
            run = 1;
          }
        }

        if (run >= 5) {
          penalty += 3 + (run - 5);
        }
      }

      for (let column = 0;
           column < size;
           column++) {

        let previous = matrix[0][column];
        let run = 1;

        for (let row = 1; row < size; row++) {
          const current =
            matrix[row][column];

          if (current === previous) {
            run++;
          } else {
            if (run >= 5) {
              penalty += 3 + (run - 5);
            }

            previous = current;
            run = 1;
          }
        }

        if (run >= 5) {
          penalty += 3 + (run - 5);
        }
      }

      // Rule 2: 2x2 blocks
      for (let row = 0; row < size - 1; row++) {
        for (let column = 0;
             column < size - 1;
             column++) {

          const value =
            matrix[row][column];

          if (
            matrix[row][column + 1] === value &&
            matrix[row + 1][column] === value &&
            matrix[row + 1][column + 1] === value
          ) {
            penalty += 3;
          }
        }
      }

      // Rule 3: finder-like pattern
      const finderPattern = [
        true,
        false,
        true,
        true,
        true,
        false,
        true
      ];

      function matchesPattern(values, offset) {
        for (let i = 0; i < 7; i++) {
          if (
            values[offset + i] !==
            finderPattern[i]
          ) {
            return false;
          }
        }

        return true;
      }

      function isWhite(values, start, end) {
        if (
          start < 0 ||
          end > values.length
        ) {
          return false;
        }

        for (let i = start; i < end; i++) {
          if (values[i]) {
            return false;
          }
        }

        return true;
      }

      for (let row = 0; row < size; row++) {
        const values = matrix[row];

        for (let i = 0; i <= size - 7; i++) {
          if (!matchesPattern(values, i)) {
            continue;
          }

          if (
            isWhite(values, i - 4, i) ||
            isWhite(values, i + 7, i + 11)
          ) {
            penalty += 40;
          }
        }
      }

      for (let column = 0;
           column < size;
           column++) {

        const values = [];

        for (let row = 0; row < size; row++) {
          values.push(matrix[row][column]);
        }

        for (let i = 0; i <= size - 7; i++) {
          if (!matchesPattern(values, i)) {
            continue;
          }

          if (
            isWhite(values, i - 4, i) ||
            isWhite(values, i + 7, i + 11)
          ) {
            penalty += 40;
          }
        }
      }

      // Rule 4: dark/light balance
      let darkCount = 0;

      for (const row of matrix) {
        for (const value of row) {
          if (value) {
            darkCount++;
          }
        }
      }

      const total = size * size;

      const balancePenalty =
        Math.floor(
          Math.abs(
            darkCount * 20 -
            total * 10
          ) /
          total
        ) * 10;

      penalty += balancePenalty;

      return penalty;
    }

    function buildQrMatrix(text) {
      const bytes =
        Array.from(
          new TextEncoder().encode(text)
        );

      const version =
        chooseVersion(bytes.length);

      const data =
        createDataCodewords(
          bytes,
          version
        );

      const codewords =
        createFinalCodewords(
          data,
          version
        );

      const size =
        version * 4 + 17;

      const baseMatrix =
        createEmptyMatrix(size);

      const baseFunctionMatrix =
        createFunctionMatrix(size);

      addFinderPattern(
        baseMatrix,
        baseFunctionMatrix,
        0,
        0
      );

      addFinderPattern(
        baseMatrix,
        baseFunctionMatrix,
        0,
        size - 7
      );

      addFinderPattern(
        baseMatrix,
        baseFunctionMatrix,
        size - 7,
        0
      );

      addAlignmentPatterns(
        baseMatrix,
        baseFunctionMatrix,
        version
      );

      addTimingPatterns(
        baseMatrix,
        baseFunctionMatrix
      );

      // Reserve format information areas.
      setFormatInfo(
        baseMatrix,
        baseFunctionMatrix,
        0,
        false
      );

      setVersionInfo(
        baseMatrix,
        baseFunctionMatrix,
        version
      );

      let bestMatrix = null;
      let bestMask = null;
      let bestPenalty = Infinity;

      for (let mask = 0; mask < 8; mask++) {
        const matrix =
          cloneMatrix(baseMatrix);

        const functionMatrix =
          cloneMatrix(baseFunctionMatrix);

        placeData(
          matrix,
          functionMatrix,
          codewords,
          mask
        );

        setFormatInfo(
          matrix,
          functionMatrix,
          mask,
          true
        );

        const penalty =
          penaltyScore(matrix);

        if (penalty < bestPenalty) {
          bestPenalty = penalty;
          bestMask = mask;
          bestMatrix = matrix;
        }
      }

      return {
        matrix: bestMatrix,
        version,
        mask: bestMask,
        byteLength: bytes.length
      };
    }

    /*
     * Canvas rendering
     */

    function drawQr(matrix) {
      const moduleCount = matrix.length;

      const totalModules =
        moduleCount + QUIET_ZONE * 2;

      const pixelSize =
        totalModules * SCALE;

      canvas.width = pixelSize;
      canvas.height = pixelSize;

      const context =
        canvas.getContext("2d");

      context.imageSmoothingEnabled = false;

      // Background
      context.fillStyle = "#ffffff";
      context.fillRect(
        0,
        0,
        pixelSize,
        pixelSize
      );

      // QR modules
      context.fillStyle = "#000000";

      for (let row = 0;
           row < moduleCount;
           row++) {

        for (let column = 0;
             column < moduleCount;
             column++) {

          if (!matrix[row][column]) {
            continue;
          }

          const x =
            (column + QUIET_ZONE) *
            SCALE;

          const y =
            (row + QUIET_ZONE) *
            SCALE;

          context.fillRect(
            x,
            y,
            SCALE,
            SCALE
          );
        }
      }
    }

    function updateCounter() {
      const bytes =
        new TextEncoder()
          .encode(textInput.value)
          .length;

      counterElement.textContent =
        `${bytes} byte${bytes === 1 ? "" : "s"}`;

      if (bytes > 858) {
        counterElement.style.color = "#fca5a5";
      } else {
        counterElement.style.color = "";
      }
    }

    function generate() {
      try {
        const text = textInput.value;

        if (!text) {
          throw new Error(
            "Text is empty."
          );
        }

        const result =
          buildQrMatrix(text);

        drawQr(result.matrix);

        infoElement.textContent =
          `Version ${result.version} · ` +
          `${result.matrix.length}×${result.matrix.length} modules · ` +
          `${result.byteLength} bytes · ` +
          `ECC L`;

        errorElement.textContent = "";
        resultElement.hidden = false;
        downloadButton.disabled = false;
      } catch (error) {
        errorElement.textContent =
          error.message;

        resultElement.hidden = true;
        downloadButton.disabled = true;
      }
    }

    function downloadPng() {
      const link =
        document.createElement("a");

      link.download = "qr-code.png";
      link.href =
        canvas.toDataURL("image/png");

      link.click();
    }

    generateButton.addEventListener(
      "click",
      generate
    );

    downloadButton.addEventListener(
      "click",
      downloadPng
    );

    textInput.addEventListener(
      "input",
      updateCounter
    );

    textInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          (event.ctrlKey || event.metaKey)
        ) {
          generate();
        }
      }
    );

    updateCounter();
  </script>
</body>
</html>
